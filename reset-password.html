<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - POLOSTEW</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --noir: #2c2418;
            --ivory: #faf6f0;
            --or: #c75d3a;
            --argent: #e8e0d4;
            --sage: #8a9a7b;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'DM Sans', sans-serif;
            background: linear-gradient(135deg, var(--ivory) 0%, var(--argent) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            color: var(--noir);
        }
        .card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.08);
            border: 1px solid var(--argent);
            max-width: 460px;
            width: 100%;
            padding: 3rem 2.5rem;
        }
        .wordmark {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            letter-spacing: 0.35em;
            color: var(--noir);
            margin-bottom: 2rem;
            font-weight: 600;
            text-align: center;
        }
        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            margin-bottom: 0.6rem;
        }
        .subtitle { color: #666; margin-bottom: 1.8rem; font-size: 0.95rem; line-height: 1.5; }
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.85rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #333;
        }
        input[type="password"] {
            width: 100%;
            padding: 1rem;
            border: 2px solid var(--argent);
            border-radius: 8px;
            font-size: 1rem;
            font-family: inherit;
            margin-bottom: 1.2rem;
        }
        input:focus { outline: none; border-color: var(--or); }
        .btn {
            width: 100%;
            padding: 1rem;
            background: var(--or);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            cursor: pointer;
            margin-top: 0.4rem;
        }
        .btn:hover { background: var(--sage); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .alert {
            padding: 0.9rem 1rem;
            border-radius: 6px;
            font-size: 0.9rem;
            margin-bottom: 1.2rem;
            line-height: 1.5;
        }
        .alert-success { background: #e8f5e9; color: #2e7d32; border: 1px solid #a5d6a7; }
        .alert-error { background: #ffebee; color: #c62828; border: 1px solid #ef9a9a; }
        .footer-link { text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: #666; }
        .footer-link a { color: var(--or); text-decoration: none; font-weight: 500; }
        .footer-link a:hover { text-decoration: underline; }
        .hint { font-size: 0.8rem; color: #999; margin-top: -0.6rem; margin-bottom: 1rem; }
    </style>
</head>
<body>
    <div class="card">
        <div class="wordmark">POLOSTEW</div>
        <h1>Set a new password</h1>
        <p class="subtitle">Choose something at least 8 characters long. You'll be signed out everywhere else.</p>

        <div id="alertBox" class="alert" style="display:none;"></div>

        <form id="resetForm">
            <label for="newPassword">New password</label>
            <input type="password" id="newPassword" required minlength="8" placeholder="••••••••">
            <div class="hint">At least 8 characters.</div>

            <label for="confirmPassword">Confirm password</label>
            <input type="password" id="confirmPassword" required minlength="8" placeholder="••••••••">

            <button type="submit" class="btn" id="submitBtn">Reset password</button>
        </form>

        <div class="footer-link">
            <a href="/login">Back to login</a>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const token = params.get('token');
        const form = document.getElementById('resetForm');
        const alertBox = document.getElementById('alertBox');
        const submitBtn = document.getElementById('submitBtn');

        function showAlert(msg, type) {
            alertBox.className = 'alert alert-' + type;
            alertBox.textContent = msg;
            alertBox.style.display = 'block';
        }

        if (!token) {
            form.style.display = 'none';
            showAlert('This reset link is missing a token. Request a new one from the forgot password page.', 'error');
        }

        form.addEventListener('submit', async function (e) {
            e.preventDefault();
            alertBox.style.display = 'none';

            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (newPassword.length < 8) {
                return showAlert('Password must be at least 8 characters.', 'error');
            }
            if (newPassword !== confirmPassword) {
                return showAlert('Passwords don\'t match.', 'error');
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Resetting…';

            try {
                const res = await fetch('/api/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, newPassword })
                });
                const data = await res.json().catch(() => ({}));
                if (res.ok) {
                    form.style.display = 'none';
                    showAlert(data.message || 'Password reset. Redirecting to login…', 'success');
                    setTimeout(() => { window.location.href = '/login'; }, 2500);
                } else {
                    showAlert(data.error || 'Could not reset password. The link may have expired.', 'error');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Reset password';
                }
            } catch (err) {
                showAlert('Network error. Please try again.', 'error');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Reset password';
            }
        });
    </script>
</body>
</html>
