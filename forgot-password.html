<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - POLOSTEW</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --noir: #2c2418;
            --ivory: #faf6f0;
            --or: #c75d3a;
            --argent: #e8e0d4;
            --sage: #8a9a7b;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'DM Sans', sans-serif;
            background: linear-gradient(135deg, var(--ivory) 0%, var(--argent) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            color: var(--noir);
        }
        .card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.08);
            border: 1px solid var(--argent);
            max-width: 460px;
            width: 100%;
            padding: 3rem 2.5rem;
        }
        .wordmark {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            letter-spacing: 0.35em;
            color: var(--noir);
            margin-bottom: 2rem;
            font-weight: 600;
            text-align: center;
        }
        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            margin-bottom: 0.6rem;
        }
        .subtitle { color: #666; margin-bottom: 1.8rem; font-size: 0.95rem; line-height: 1.5; }
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.85rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #333;
        }
        input[type="email"] {
            width: 100%;
            padding: 1rem;
            border: 2px solid var(--argent);
            border-radius: 8px;
            font-size: 1rem;
            font-family: inherit;
            margin-bottom: 1.4rem;
        }
        input:focus { outline: none; border-color: var(--or); }
        .btn {
            width: 100%;
            padding: 1rem;
            background: var(--or);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            cursor: pointer;
        }
        .btn:hover { background: var(--sage); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .alert {
            padding: 0.9rem 1rem;
            border-radius: 6px;
            font-size: 0.9rem;
            margin-bottom: 1.2rem;
            line-height: 1.5;
        }
        .alert-success { background: #e8f5e9; color: #2e7d32; border: 1px solid #a5d6a7; }
        .alert-error { background: #ffebee; color: #c62828; border: 1px solid #ef9a9a; }
        .footer-link { text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: #666; }
        .footer-link a { color: var(--or); text-decoration: none; font-weight: 500; }
        .footer-link a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="card">
        <div class="wordmark">POLOSTEW</div>
        <h1>Forgot password?</h1>
        <p class="subtitle">Enter your email and we'll send you a link to set a new one.</p>

        <div id="alertBox" class="alert" style="display:none;"></div>

        <form id="forgotForm">
            <label for="email">Email address</label>
            <input type="email" id="email" required placeholder="you@example.com">
            <button type="submit" class="btn" id="submitBtn">Send reset link</button>
        </form>

        <div class="footer-link">
            Remembered it? <a href="/login">Back to login</a>
        </div>
    </div>

    <script>
        const form = document.getElementById('forgotForm');
        const alertBox = document.getElementById('alertBox');
        const submitBtn = document.getElementById('submitBtn');

        function showAlert(msg, type) {
            alertBox.className = 'alert alert-' + type;
            alertBox.textContent = msg;
            alertBox.style.display = 'block';
        }

        form.addEventListener('submit', async function (e) {
            e.preventDefault();
            alertBox.style.display = 'none';
            submitBtn.disabled = true;
            submitBtn.textContent = 'Sending…';

            const email = document.getElementById('email').value.trim();
            try {
                const res = await fetch('/api/auth/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                const data = await res.json().catch(() => ({}));
                showAlert(
                    data.message ||
                    'If an account exists for that email, a reset link is on its way.',
                    'success'
                );
                form.reset();
            } catch (err) {
                showAlert('Something went wrong. Please try again in a moment.', 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Send reset link';
            }
        });
    </script>
</body>
</html>
